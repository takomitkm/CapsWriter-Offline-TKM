name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 2.6-test，留空则只构建不发 Release）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: 构建（Windows）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: 3.14

      - name: 安装依赖（含 pyinstaller）
        run: uv sync --group build

      - name: PyInstaller 打包
        run: uv run pyinstaller build.spec --noconfirm --clean --distpath dist --workpath build

      - name: 生成发布压缩包
        run: uv run python zip_release.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: capswriter-release
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: 创建 Release
        if: ${{ inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: CapsWriter-Offline ${{ inputs.version }}
          files: release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
