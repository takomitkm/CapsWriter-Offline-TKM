name: unbound-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install rich PyYAML
      - name: Queue and CI regressions
        run: python tests/review_regressions.py
      - name: File transcription regressions
        run: python tests/file_transcriber_regressions.py

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pyright
        run: npm install -g pyright

      - name: Check changed Python files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(["git", *args])

          base = os.environ["BASE_SHA"]
          if not base or base == "0" * 40:
              default = os.environ["DEFAULT_BRANCH"]
              git("fetch", "origin", f"refs/heads/{default}:refs/remotes/origin/{default}")
              base = git("merge-base", "HEAD", f"origin/{default}").decode().strip()

          comparison = f"{base}...HEAD" if os.environ["EVENT_NAME"] == "pull_request" else base
          paths = git("diff", "--name-only", "--diff-filter=ACMRT", "-z", comparison, "--", "*.py")
          files = [os.fsdecode(p) for p in paths.split(b"\0") if p]
          files = [p for p in files if not p.startswith("core/server/engines/")]
          if not files:
              print("没有改动的 Python 文件")
              sys.exit(0)

          print("检查文件:", *files, sep="\n", flush=True)
          result = subprocess.run(["pyright", "--outputjson", *files], capture_output=True, text=True)
          if result.stderr:
              print(result.stderr, file=sys.stderr)
          if result.returncode not in (0, 1):
              raise RuntimeError(f"Pyright 执行失败，退出码 {result.returncode}")
          report = json.loads(result.stdout)
          diagnostics = report["generalDiagnostics"]
          rules = {"reportPossiblyUnboundVariable", "reportUnboundVariable"}
          bad = [d for d in diagnostics if d.get("rule") in rules or
                 (d["severity"] == "error" and not d.get("rule"))]
          for d in bad:
              line = d["range"]["start"]["line"] + 1
              print(f'{d["file"]}:{line}: {d["message"]}')
          sys.exit(1 if bad else 0)